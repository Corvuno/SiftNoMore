<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sift</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <nav class="side" aria-label="Sections">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" fill="var(--accent)"/><rect x="6" y="7" width="12" height="2" rx="1" fill="var(--on-accent)"/><rect x="8" y="11" width="8" height="2" rx="1" fill="var(--on-accent)"/><rect x="10" y="15" width="4" height="2" rx="1" fill="var(--on-accent)"/></svg>
      <span>Sift</span>
    </div>

    <div class="navgroup">
      <div class="navlabel">Files</div>
      <button class="navitem" data-view="scan"><span class="step">1</span><span class="lbl">Scan<small id="scanInfo">Not scanned yet</small></span></button>
      <div id="scanBar" class="bar navbar" hidden><i></i></div>
      <button class="navitem" data-view="old"><span class="step">2</span><span class="lbl">Old downloads</span><span class="count" id="countOld"></span></button>
      <button class="navitem" data-view="dupes"><span class="step">3</span><span class="lbl">Duplicates</span><span class="count" id="countDupes"></span></button>
    </div>

    <div class="navgroup">
      <div class="navlabel">Windows</div>
      <div class="navsoon">Startup programs and temp files come here later.</div>
    </div>

    <div class="grow"></div>

    <div class="navgroup">
      <button class="navitem" data-view="history"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 4v4h4"/><path d="M12 8v4l2.5 1.5"/></svg><span class="lbl">History</span></button>
      <button class="navitem" data-view="kept"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg><span class="lbl">Kept and protected</span></button>
    </div>
  </nav>

  <main id="main" class="main"></main>
</div>

<dialog id="confirm" class="dialog"></dialog>
<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
