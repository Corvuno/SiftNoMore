<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sift</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" fill="var(--accent)"/><rect x="6" y="7" width="12" height="2" rx="1" fill="var(--on-accent)"/><rect x="8" y="11" width="8" height="2" rx="1" fill="var(--on-accent)"/><rect x="10" y="15" width="4" height="2" rx="1" fill="var(--on-accent)"/></svg>
      <span>Sift</span>
    </div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Jobs"></div>
    <div class="strip" id="strip" aria-label="More">
      <button data-view="windows" title="Startup programs and temporary files: comes later">Windows cleaning</button>
      <button data-view="kept">Kept and protected</button>
      <button data-view="history">History</button>
    </div>
  </header>
  <nav class="steps" id="steps" aria-label="Steps of this job" hidden></nav>
  <main id="main" class="main"></main>
</div>

<dialog id="confirm" class="dialog"></dialog>
<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
