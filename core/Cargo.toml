[package]
name = "sift-core"
version.workspace = true
edition.workspace = true
description = "Sift's scanning and matching: what is old, what is a duplicate."

[dependencies]
walkdir = "2"
globset = "0.4"
md-5 = "0.10"
rayon = "1"
serde = { version = "1", features = ["derive"] }
regex = "1"
strsim = "0.11"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
